    .topbar {

    header {

    .brand {

    .brand-text p {
      color: #777;

    }

    nav {
      display: flex;

    }

      font-size: 14px;
    }

    nav a:hover {
      color: #075e54;
    }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, #075e54, #128c7e);
      color: white;
      text-align: center;
      padding: 70px 20px;
    }

    .hero h2 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      max-width: 850px;
      margin: auto;
      font-size: 18px;
    }

    /* CONTAINER */
    .container {
      max-width: 1150px;
      margin: auto;
      padding: 50px 20px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 35px;
    }

    .section-title h2 {
      color: #075e54;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #666;
    }

    /* INTRO */
    .intro {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
    }

    .intro p {
      font-size: 17px;
      text-align: justify;
    }

    /* CARDS */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .card {
      background: white;
      padding: 28px 22px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card .icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .card h3 {
      color: #075e54;
      margin-bottom: 10px;
      font-size: 20px;
    }

    .card p {
      color: #555;
      font-size: 15px;
    }

    /* GREEN SECTION */
    .green-section {
      background: #eaf7f5;
    }

    }

      list-style: none;
